@keyframes settle{0%{fill:#2a2150}25%{fill:#7c6cf0}50%,100%{fill:#6ee7f9}}
.scan{animation:scan 4s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(480px)}}
.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.e{animation:fade 4s ease-in-out infinite}
@keyframes fade{0%,40%{opacity:0}60%,100%{opacity:1}}
</style>
</defs>
