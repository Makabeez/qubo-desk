<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c091a"/><stop offset="1" stop-color="#1b1236"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9a7ff"/><stop offset="1" stop-color="#6ee7f9"/></linearGradient>
